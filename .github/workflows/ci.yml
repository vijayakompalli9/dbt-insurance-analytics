name: ci

# Runs on every push to main and on pull requests. Fully offline: DuckDB only,
# no warehouse credentials and no dbt hub packages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Lint Python (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Seeds are reproducible
        run: |
          python scripts/generate_seeds.py --out seeds
          git diff --exit-code -- seeds

      - name: Build warehouse (snapshot replay + dbt build)
        run: make build

      - name: Lint SQL (sqlfluff, dbt templater)
        run: sqlfluff lint models data_tests/singular

      - name: pytest (unit + end-to-end)
        run: python -m pytest

      - name: Source freshness (informational, static 2025 data reports STALE)
        run: make freshness

      - name: Generate dbt docs
        run: make docs

      - name: Publish loss-ratio summary to the run page
        run: |
          python scripts/export_marts.py --out ci-out
          cat ci-out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-artifacts
          path: |
            target/manifest.json
            target/run_results.json
            target/catalog.json
            ci-out/
          if-no-files-found: ignore
